<!DOCTYPE html>
<html lang="ja">
<head>
  <title>ちょちょうせい</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=JetBrains+Mono:wght@500&display=swap">
  <style>
/* 方眼の手帳のような落ち着いた画面。藍の差し色、○△×は意味色で区別 */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --ink: #18202e;
  --ink-2: #5a6273;
  --line: #dde1e8;
  --accent: #2d4bb3;
  --accent-ink: #ffffff;
  --accent-soft: #e6ebfa;
  --ok: #138a5a;
  --ok-soft: #dcf3e8;
  --maybe: #b7791f;
  --maybe-soft: #fbf0d9;
  --ng: #8b93a3;
  --ng-soft: #eceef2;
  --busy: #c7ccd6;
  --danger: #c2372e;
  --best: #fff6c9;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --surface: #191f29; --surface-2: #222a36; --ink: #e8ebf1; --ink-2: #9aa3b4;
    --line: #2d3644; --accent: #7d9bff; --accent-ink: #0d1220; --accent-soft: #232f52;
    --ok: #4cc58f; --ok-soft: #173a2b; --maybe: #e2a94b; --maybe-soft: #3b2f17; --ng: #7d8697; --ng-soft: #252c37;
    --busy: #3a4352; --danger: #ef6b62; --best: #3a3418; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --surface: #191f29; --surface-2: #222a36; --ink: #e8ebf1; --ink-2: #9aa3b4;
  --line: #2d3644; --accent: #7d9bff; --accent-ink: #0d1220; --accent-soft: #232f52;
  --ok: #4cc58f; --ok-soft: #173a2b; --maybe: #e2a94b; --maybe-soft: #3b2f17; --ng: #7d8697; --ng-soft: #252c37;
  --busy: #3a4352; --danger: #ef6b62; --best: #3a3418; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 0 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.boot { padding: 40px; text-align: center; color: var(--ink-2); }

/* ヘッダー */
.topbar {
  display: flex; align-items: center; gap: 12px; padding-block: 14px;
  border-bottom: 1px solid var(--line); margin-bottom: 18px;
}
.brand { font-family: var(--font-display); font-weight: 900; font-size: 17px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(3, 7px); gap: 2px; }
.brand-mark i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.brand-mark i.on { background: var(--accent); }
.topbar .spacer { flex: 1; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.35; text-wrap: balance; margin: 0; }
h1 { font-size: 24px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
label.row { flex-wrap: nowrap; align-items: flex-start; cursor: pointer; }
label.row > input { flex: none; margin-top: 5px; }
.section { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
.section-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.section-head .spacer { flex: 1; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--ink-2); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel.flush { padding: 0; overflow: hidden; }

/* ボタン */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.line { background: #06c755; border-color: #06c755; color: #fff; font-weight: 700; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* フォーム */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.input, select.input, textarea.input {
  width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); outline: none;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { min-height: 80px; resize: vertical; line-height: 1.6; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 4px;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip.dim { opacity: .55; }

.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 10px; }
.tab { flex: 1; min-height: 36px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--ink-2); }
.tab.on { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.pill.open { background: var(--accent-soft); color: var(--accent); }
.pill.decided { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--maybe-soft); color: var(--maybe); }

/* 一覧 */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .body { flex: 1; min-width: 0; }
.item .title { font-weight: 700; overflow-wrap: anywhere; }
.item .meta { font-size: 13px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; }
.item.clickable { cursor: pointer; }
.item.clickable:hover { background: var(--surface-2); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }

/* ===== 週グリッド（候補入力） ===== */
.wk-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.wk-nav .range { font-weight: 700; min-width: 0; flex: 1; text-align: center; }
.wk-scroll { overflow: auto; max-height: 520px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.wk { display: grid; grid-template-columns: 38px repeat(7, minmax(40px, 1fr)); min-width: 320px; position: relative; }
.wk-head { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); text-align: center; padding: 6px 0 4px; font-size: 12px; line-height: 1.3; }
.wk-head b { display: block; font-size: 15px; font-family: var(--font-num); }
.wk-head.sat { color: #2f6fd6; } .wk-head.sun { color: var(--danger); }
.wk-head.today b { color: var(--accent-ink); background: var(--accent); border-radius: 6px; margin: 0 6px; }
.wk-allday { grid-column: 2 / -1; display: none; }
.wk-times { position: relative; }
.wk-time { height: var(--cell); font-size: 10.5px; color: var(--ink-2); text-align: right; padding-right: 4px; transform: translateY(-7px); font-family: var(--font-num); }
.wk-day { position: relative; border-left: 1px solid var(--line); }
.wk-cell { height: var(--cell); border-top: 1px solid transparent; cursor: pointer; touch-action: pan-x pan-y; }
.wk-cell.hour { border-top-color: var(--line); }
.wk-cell.half { border-top: 1px dashed color-mix(in srgb, var(--line) 60%, transparent); }
.wk-cell:hover { background: var(--accent-soft); }
.wk-cell.past { background: repeating-linear-gradient(45deg, transparent 0 4px, var(--surface-2) 4px 6px); cursor: not-allowed; }
.wk-busy {
  position: absolute; left: 2px; right: 2px; border-radius: 4px; pointer-events: none;
  background: var(--busy); opacity: .75; font-size: 10px; line-height: 1.25; padding: 2px 3px; overflow: hidden; color: var(--ink);
}
.wk-busy.allday { position: static; display: block; margin: 0 2px 2px; opacity: .9; }
.wk-slot {
  position: absolute; left: 3px; right: 3px; border-radius: 5px; background: var(--accent); color: var(--accent-ink);
  font-size: 11px; line-height: 1.2; padding: 2px 4px; cursor: pointer; z-index: 2; overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.18); font-family: var(--font-num); font-weight: 500;
}
.wk-slot.conflict { background: repeating-linear-gradient(135deg, var(--accent) 0 6px, color-mix(in srgb, var(--accent) 70%, var(--danger)) 6px 12px); }
.wk-slot:hover::after { content: "×"; position: absolute; right: 4px; top: 1px; font-size: 13px; }
.wk-alldays { display: contents; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }

/* ミニ月カレンダー */
.mcal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.mcal .dow { text-align: center; font-size: 12px; color: var(--ink-2); padding-bottom: 2px; }
.mcal .d {
  aspect-ratio: 1 / 1; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  cursor: pointer; font-family: var(--font-num); font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.mcal .d small { font-size: 9px; color: var(--ink-2); font-family: var(--font-body); }
.mcal .d.sat { color: #2f6fd6; } .mcal .d.sun { color: var(--danger); }
.mcal .d.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mcal .d.on small { color: var(--accent-ink); }
.mcal .d[disabled] { opacity: .3; cursor: default; }
.mcal .d.blank { visibility: hidden; }
.mcal .d.today { box-shadow: inset 0 0 0 2px var(--accent); }

/* 選択済み候補 */
.picked-day { display: grid; grid-template-columns: 92px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); align-items: start; }
.picked-day:first-child { border-top: 0; }
.picked-day .d { font-weight: 700; font-size: 14px; padding-top: 5px; }
.slot-chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 4px 0 10px; border-radius: 8px;
  background: var(--accent-soft); color: var(--ink); font-family: var(--font-num); font-size: 13px;
}
.slot-chip.conflict { background: var(--maybe-soft); }
.slot-chip button { border: 0; background: transparent; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 16px; line-height: 1; }
.slot-chip button:hover { background: rgba(0,0,0,.08); }

/* ===== 回答 ===== */
.ans-list { display: flex; flex-direction: column; }
.ans-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.ans-row:first-child { border-top: 0; }
.ans-row .when { font-weight: 700; font-size: 15px; }
.ans-row .when .num { font-weight: 500; }
.ans-row .tally { font-size: 12px; color: var(--ink-2); }
.ans-row.best { background: var(--best); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button {
  width: 48px; height: 44px; border: 0; background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ng);
  border-left: 1px solid var(--line);
}
.seg button:first-child { border-left: 0; }
.seg button.o.on { background: var(--ok); color: #fff; }
.seg button.t.on { background: var(--maybe); color: #fff; }
.seg button.x.on { background: var(--ng); color: #fff; }

.mark-o { color: var(--ok); font-weight: 700; }
.mark-t { color: var(--maybe); font-weight: 700; }
.mark-x { color: var(--ng); }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.tbl thead th { background: var(--surface-2); font-size: 12px; font-weight: 700; position: sticky; top: 0; }
.tbl th.slot { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; font-weight: 700; }
.tbl thead th.slot { background: var(--surface-2); z-index: 2; }
.tbl tr.best td, .tbl tr.best th.slot { background: var(--best); }
.tbl tr.decided td, .tbl tr.decided th.slot { background: var(--ok-soft); }
.tbl .name-h { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.tbl .score { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tbl td.act { padding: 4px 8px; }

.banner { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.banner.ok { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.banner .big { font-family: var(--font-display); font-size: 20px; font-weight: 900; }

.copybox { display: flex; gap: 6px; }
.copybox input { flex: 1; min-width: 0; font-family: var(--font-num); font-size: 13px; }

/* 下部固定バー */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px);
  border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
.dock .inner .info { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); }

/* モーダル */
.modal-bg { position: fixed; inset: 0; background: rgba(10,14,22,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal-bg { align-items: center; } }
.modal {
  background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh; overflow: auto;
  border-radius: 16px 16px 0 0; padding: 20px max(18px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 640px) { .modal { border-radius: 16px; } }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

#toast {
  position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 60;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { background: var(--danger); color: #fff; }

.busy-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(10,14,22,.15); display: flex; align-items: center; justify-content: center; }
.spinner { width: 34px; height: 34px; border: 3px solid var(--surface); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } #toast { transition: none; } }

pre.share { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 12px; margin: 0; font: 14px/1.6 var(--font-body); overflow-wrap: anywhere; }
.hint { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
</style>

</head>
<body>
  <div id="app"><div class="boot">読み込み中…</div></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

</script>
  <script>
(function () {
'use strict';

/* ================= 共通ユーティリティ ================= */
var B = window.BOOT || {};
var JST = 9 * 3600000, DAY = 86400000;
var WD = ['日', '月', '火', '水', '木', '金', '土'];
var app = document.getElementById('app');
var modalRoot = document.getElementById('modal-root');

function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);

  });
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c) {
  if (c == null || c === false) return;

  el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(e && e.message ? new Error(e.message.replace(/^Exception: /, '')) : e);
    });
    r[fn].apply(r, args);
  });
}

var busyCount = 0, busyEl = null;
function withBusy(p) {
  busyCount++;
  if (!busyEl) { busyEl = h('div', { class: 'busy-overlay' }, h('div', { class: 'spinner' })); document.body.appendChild(busyEl); }
  return p.then(function (v) { done(); return v; }, function (e) { done(); throw e; });
  function done() { if (--busyCount <= 0 && busyEl) { busyEl.remove(); busyEl = null; busyCount = 0; } }

var toastTimer;

/* --- 日時（常に日本時間で扱う） --- */
function parts(ms) { var d = new Date(ms + JST); return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate(), w: d.getUTCDay(), hh: d.getUTCHours(), mm: d.getUTCMinutes() }; }
function mk(y, m, d, hh, mm) { return Date.UTC(y, m, d, hh || 0, mm || 0) - JST; }
function dayStart(ms) { var p = parts(ms); return mk(p.y, p.m, p.d); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function hm(ms) { var p = parts(ms); return pad(p.hh) + ':' + pad(p.mm); }
function hmEnd(s) { return dayStart(s.end) !== dayStart(s.start) && s.end === dayStart(s.end) ? '24:00' : hm(s.end); }
function md(ms) { var p = parts(ms); return (p.m + 1) + '/' + p.d + '(' + WD[p.w] + ')'; }
function fmtSlot(s) {
  var endP = parts(s.end), sameDay = dayStart(s.start) === dayStart(s.end - 1);
  return md(s.start) + ' ' + hm(s.start) + '–' + (sameDay ? (endP.hh === 0 && endP.mm === 0 ? '24:00' : hm(s.end)) : md(s.end) + ' ' + hm(s.end));
}
function fmtDeadline(dstr) { if (!dstr) return ''; var a = dstr.split('-'); var ms = mk(+a[0], +a[1] - 1, +a[2]); return md(ms); }
function uid() { return Math.random().toString(36).slice(2, 10); }

function lineShareUrl(text) { return 'https://line.me/R/share?text=' + encodeURIComponent(text); }
function gcalTemplateUrl(title, s, details, location) {
  function z(ms) { return new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) +
    '&dates=' + z(s.start) + '/' + z(s.end) + '&details=' + encodeURIComponent(details || '') + '&location=' + encodeURIComponent(location || '');
}
function copyText(text, input) {
  var ok = function () { toast('コピーしました'); };
  try {
    navigator.clipboard.writeText(text).then(ok, fallback);
  } catch (e) { fallback(); }
  function fallback() {

    if (!input) document.body.appendChild(el);
    el.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('長押しでコピーしてください'); }
    if (!input) el.remove();

}

/* --- 集計 --- */
function tally(slots, responses) {
  var res = {};
  slots.forEach(function (s) { res[s.id] = { o: 0, t: 0, x: 0, score: 0 }; });
  responses.forEach(function (r) {
    slots.forEach(function (s) {
      var a = r.answers[s.id]; if (!a) return;
      res[s.id][a]++; res[s.id].score += a === 'o' ? 2 : a === 't' ? 1 : 0;
    });
  });
  var max = 0;
  slots.forEach(function (s) { max = Math.max(max, res[s.id].score); });
  slots.forEach(function (s) { res[s.id].best = max > 0 && res[s.id].score === max; });
  return res;
}

function bumpTitle(t) {
  var m = t.match(/第(\d+)回/);
  if (m) return t.replace(/第\d+回/, '第' + (+m[1] + 1) + '回');
  m = t.match(/^(.*?)(\d+)(\D*)$/);
  if (m && +m[2] < 1000) return m[1] + (+m[2] + 1) + m[3];
  return t;
}
function nthWeekdayShift(ms) { // 翌月の同じ「第N◯曜日」
  var p = parts(ms), nth = Math.floor((p.d - 1) / 7);
  var y = p.m === 11 ? p.y + 1 : p.y, m = (p.m + 1) % 12;
  var first = parts(mk(y, m, 1)).w;
  var d = 1 + ((p.w - first + 7) % 7) + nth * 7;
  if (d > new Date(Date.UTC(y, m + 1, 0)).getUTCDate()) d -= 7;
  return mk(y, m, d, p.hh, p.mm);
}

    var re = /(\d{1,2})(?::(\d{2})|時(半|\d{1,2}分)?)\s*(?:-\s*(\d{1,2})(?::(\d{2})|時(半|\d{1,2}分)?)?)?/g, m, found = false;

      var sh = +m[1], sm = m[2] ? +m[2] : m[3] === '半' ? 30 : m[3] ? parseInt(m[3], 10) : 0;
      if (sh > 29 || sm > 59) continue;
      var start = base + (sh * 60 + sm) * 60000, end = 0;
      if (m[4]) { var eh = +m[4], em = m[5] ? +m[5] : m[6] === '半' ? 30 : m[6] ? parseInt(m[6], 10) : 0; end = base + (eh * 60 + em) * 60000; if (end <= start) end = 0; }
      out.push({ start: start, end: end }); found = true;
    }
    if (!found) out.push({ start: base + 19 * 3600000, end: 0, guessed: true });
  });
  return out;
}
function drawText(panel) {
  var ta = h('textarea', { id: 'paste', class: 'input', rows: '6', placeholder: '例）\n11/18(水) 19:00\n11/20 20時〜21時半\n11月25日 10:00, 14:00' }, E.textDraft || '');

  function update() {
    E.textDraft = ta.value;
    var list = parseText(ta.value);
    clear(prev);
    if (!ta.value.trim()) return;
    append(prev, list.length ? [h('div', { class: 'label' }, '読み取り結果（' + list.length + '件）'),
      h('div', { class: 'chips', style: 'margin-top:6px' }, list.map(function (s) {
        return h('span', { class: 'slot-chip' + (s.guessed ? ' conflict' : '') }, md(s.start) + ' ' + hm(s.start) + (s.end ? '–' + hm(s.end) : '') + (s.guessed ? '（時刻なし→19:00）' : ''));
      }))] : h('span', { class: 'muted' }, '日付が読み取れませんでした（例：11/18 19:00）'));
  }
  ta.addEventListener('input', update);
  append(panel, [h('div', { class: 'small muted' }, 'LINEやメモの候補をそのまま貼り付けてください。1行に複数の時刻も書けます。時刻に範囲（19:00-21:00）があればその長さで、なければ所要時間で作ります。'),
    ta, prev,
    h('button', { class: 'btn primary block', onclick: function () {

      toast(n + '件の候補を追加しました' + (list.length - n ? '（過去・重複の' + (list.length - n) + '件は除外）' : ''));

    } }, '候補に追加')]);

}

/* ---- 追加済み候補の一覧 ---- */

  slots.forEach(function (s) { var k = dayStart(s.start); if (!cur || cur.k !== k) { cur = { k: k, list: [] }; groups.push(cur); } cur.list.push(s); });
  return h('div', { class: 'panel picked' }, groups.map(function (g) {
    return h('div', { class: 'picked-day' }, h('div', { class: 'd' }, md(g.k)),
      h('div', { class: 'chips' }, g.list.map(function (s) {

}

function saveEvent() {

  var isNew = !d.id;
  withBusy(call('api_adminSaveEvent', B.admin, d)).then(function (r) {
    return withBusy(call('api_adminGetEvent', B.admin, r.event.id)).then(function (full) {
      renderAdminEvent(full);

}

function openShare(ev) {

    h('h2', null, 'Googleカレンダー'),
    h('div', { class: 'field' }, h('span', null, '候補入力のときに「埋まっている時間」として表示するカレンダー'),
      cals.map(function (c) { return h('label', { class: 'row small' }, h('input', { type: 'checkbox', checked: !!sel[c.id], onchange: function (e) { if (e.target.checked) sel[c.id] = true; else delete sel[c.id]; } }), c.name + (c.primary ? '（メイン）' : '')); })),
    h('label', { class: 'field' }, h('span', null, '決定した予定の登録先'),
      h('select', { id: 'tc', class: 'input', onchange: function (e) { st.targetCalendarId = e.target.value; } },
        cals.filter(function (c) { return c.owned; }).map(function (c) { return h('option', { value: c.id, selected: st.targetCalendarId ? st.targetCalendarId === c.id : c.primary }, c.name); })))));
  wrap.appendChild(h('div', { class: 'section panel stack' },
    h('h2', null, '候補入力'),
    h('div', { class: 'grid2' },
      h('label', { class: 'field' }, h('span', null, '既定の所要時間（分）'), h('input', { id: 'dd', class: 'input', type: 'number', min: '10', step: '10', value: st.defaultDuration, onchange: function (e) { st.defaultDuration = +e.target.value; } })),
      h('label', { class: 'field' }, h('span', null, 'カレンダーの表示時間帯'),
        h('div', { class: 'row' },
          h('input', { id: 'sh', class: 'input', type: 'number', min: '0', max: '23', value: st.dayStartHour, style: 'width:80px', onchange: function (e) { st.dayStartHour = +e.target.value; } }), '時〜',
          h('input', { id: 'eh', class: 'input', type: 'number', min: '1', max: '24', value: st.dayEndHour, style: 'width:80px', onchange: function (e) { st.dayEndHour = +e.target.value; } }), '時')))));
  app.appendChild(wrap);
  app.appendChild(h('div', { class: 'dock' }, h('div', { class: 'inner' }, h('div', { class: 'info' }), h('button', { class: 'btn', onclick: function () { go('home'); } }, '戻る'),
    h('button', { class: 'btn primary', onclick: function () {
      st.calendarIds = Object.keys(sel);
      withBusy(call('api_adminSaveSettings', B.admin, st)).then(function (s) { A.init.settings = s; A.busy = {}; A.busyLoaded = {}; toast('保存しました'); go('home'); }, fail);
    } }, '保存'))));
}

/* ================= 起動 ================= */
function showError(e) {
  clear(app);
  app.appendChild(h('div', { class: 'wrap' }, topbar(), h('div', { class: 'panel empty' }, (e && e.message) || String(e))));
}
if (B.admin) {
  withBusy(loadAdmin()).then(function () {
    if (B.eventId) go('event', B.eventId); else renderHome();
  }).catch(showError);
} else if (B.eventId) {
  withBusy(loadParticipant()).catch(showError);
} else {
  clear(app);
  app.appendChild(h('div', { class: 'wrap' }, topbar(), h('div', { class: 'panel empty' }, '日程調整のURLを開いてください。')));
}
})();
